name: spatial-genomics
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - jupyter
  - jupyterlab
  - ipykernel
  - matplotlib
  - seaborn
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pip:
    - scanpy>=1.9.0
    - squidpy>=1.2.0
    - anndata>=0.8.0
    - spatialdata
    - spatialdata-io
    - leidenalg
    - python-igraph
    - openpyxl
    - zarr
    - dask
    - napari-spatialdata
